# Base Camp OS — Spark1 deployment (backend only; UI omitted).
# Ports remapped to avoid Spark1 collisions (oracle-prototype owns 5433/3001;
# 8001/5435/8101 checked free). Own project name + network + volume.
name: basecamp

networks:
  basecamp-net:
    driver: bridge

volumes:
  basecamp_pg_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: basecamp-db
    networks: [basecamp-net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: basecamp
    volumes:
      - basecamp_pg_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basecamp-api
    networks: [basecamp-net]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/basecamp
      ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:8110"
    ports:
      - "8101:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
